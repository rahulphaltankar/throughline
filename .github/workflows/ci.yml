name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML pytest

      - name: Unit and gate tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Exhaustive ontology and archetype graph validation
        run: python scripts/validate_ontology.py

      - name: Artefact gate over PP20 benchmark fixtures
        run: python scripts/run_pp20_pipeline.py

      - name: Local execution-layer smoke test
        run: python scripts/run_pipeline.py projects/pp20/problem.yaml --out /tmp/throughline-run

      - name: Every broken fixture must be rejected
        run: |
          set -e
          fail=0
          for f in tests/fixtures/broken/*.md; do
            if python scripts/gates/validate_artifact.py "$f" > /dev/null 2>&1; then
              echo "FALSE POSITIVE: the gate accepted $f"
              fail=1
            fi
          done
          exit $fail

      - name: Compile the PP20 intake into an artefact plan
        run: PYTHONPATH=src python -m throughline.cli plan projects/pp20/problem.yaml --out /tmp/throughline-pp20
